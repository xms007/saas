  const retry = bootstrap.querySelector('.retry')
  bootstrap.style.visibility = 'visible'
  // 入口资源在 head 阶段就失败时，必须在这里立刻把它呈现出来。
  // 否则用户要白等 8s 兜底超时才看到「加载超时」—— 那 8s 会被感知成「加载很慢」。
  if (globalThis.__appResourceErrorText) showError(globalThis.__appResourceErrorText)
  let pageLoaderShowTimer = null
  // 首屏启动层已经负责展示加载状态，避免启动阶段的 uni.showLoading 重复叠加。
  globalThis.__suppressPageLoaderUntil = Date.now() + 15000

  // uni.showLoading 的垫片（App.vue 把 uni.showLoading 指到这里）。
  // 延迟 220ms 再真正可见：页面内的短操作（几百毫秒）不该闪一下整页遮罩。
  window.__showPageLoader = () => {
    if (Number(globalThis.__suppressPageLoaderUntil || 0) > Date.now()) return
    clearTimeout(pageLoaderShowTimer)
    bootstrap.hidden = false
    bootstrap.classList.remove('is-error')
    bootstrap.style.visibility = 'hidden'
    document.body.classList.add('app-page-loader-active')
    pageLoaderShowTimer = setTimeout(() => {
      bootstrap.style.visibility = 'visible'
    }, 220)
  }

  // 加载层只有一个「撤」的实现：页面级调用（uni.hideLoading 垫片）与首屏撤遮罩共用它。
  function hideBootstrap() {
    clearTimeout(pageLoaderShowTimer)
    pageLoaderShowTimer = null
    bootstrap.hidden = true
    bootstrap.style.visibility = 'hidden'
    document.body.classList.remove('app-page-loader-active')
  }
  window.__hidePageLoader = () => hideBootstrap()

  function showError(text = '资源加载失败，请检查网络后重试') {
    bootstrap.classList.add('is-error')
    hint.textContent = text
  }

  /*
    重试 = 清缓存 + 强制回源取新文档，不能只写 location.reload()：
    旧文档引用的旧 chunk 发版后已被删，复用手里那份 HTML 还是白屏，点多少次都一样。
      ① 清 Cache Storage（本项目暂无 SW，当前是空操作，留给以后）；
      ② 不动 localStorage / sessionStorage：登录态与租户在里面，清了等于把用户踢下线；
      ③ 用带唯一查询串的地址重新导航（查询串插在 hash 之前，不影响 hash 路由）。
    绕不过 CDN 边缘缓存：Cloudflare 的缓存键忽略查询串（实测加 ?cb= 仍 HIT），
    那种情况只能服务端 purge，见 asset.config.ts 的发布顺序约定。
  */
  let retrying = false
  retry.addEventListener('click', () => {
    if (retrying) return
    retrying = true
    retry.disabled = true
    hint.textContent = '正在清理缓存并重新加载…'

    const cachesCleared = globalThis.caches && typeof globalThis.caches.keys === 'function'
      ? globalThis.caches.keys()
        .then((keys) => Promise.all(keys.map((key) => globalThis.caches.delete(key))))
        .catch(() => undefined)
      : Promise.resolve(undefined)

    const finish = () => {
      const url = new URL(window.location.href)
      url.searchParams.set('_r', Date.now().toString(36))
      window.location.replace(url.toString())
    }
    // 先让「正在清理…」有一帧渲染机会；同时设 1.2s 上限，别让清缓存把重试卡住。
    Promise.race([cachesCleared, new Promise((resolve) => setTimeout(resolve, 1200))]).then(finish)
  })

  window.addEventListener('app-ready', () => {
    globalThis.__appReady = true
    globalThis.__suppressPageLoaderUntil = 0
    /*
      清掉重试时加的 `_r`，别让它常驻地址栏 —— 否则会被「分享 / 收藏」带出去，
      也会让之后每次回访都用一个带随机参数的 URL（缓存形同虚设）。
      必须把 history.state 原样传回去：hash 路由（vue-router）把滚动/导航状态
        存在 history.state 里，传 null 会把它清掉、破坏前进后退。
      必须包 try/catch：本监听器是唯一安排 reveal 的地方，这里抛异常会让下面
        整段都不执行，遮罩永不撤除，用户看到的是「一直转圈 / 打不开」。
        个别 Android WebView 对 replaceState 比 iOS 严格（跨域/编码差异都可能抛），
        清理地址栏只是锦上添花，绝不能连累撤遮罩。
    */
    if (window.location.search.indexOf('_r=') !== -1) {
      try {
        const cleaned = new URL(window.location.href)
        cleaned.searchParams.delete('_r')
        window.history.replaceState(window.history.state, '', cleaned.toString())
      } catch (_) {
        // 清不掉就算了：URL 上留个 _r 不影响任何功能。
      }
    }
    // 启动层必须晚于 #app 可见才能撤场。它自己的背景是不透明的，而
    // html.miniapp-theme-pending 下 body 是 transparent —— 一旦「遮罩先撤、#app 后开」，
    // 两层之间就会露出一帧白屏。所以先等这个类被摘掉（App.vue 摘掉它 = 放行 #app），
    // 再等两帧移除启动层。最长等 1.5s 兜底，避免主题异常时遮罩永不撤除。
    const readyAt = Date.now()
    /*
      撤遮罩条件：页面真的渲染出内容（可见骨架 / 渲染器块 / 正文），且主题 pending 已摘掉
      （先撤再换肤会闪）。只等 app-ready 就撤会露空白，等图片又会被外部图床拖长。
    */
    // 上限 7000：慢网下首屏 JS+CSS 要 5~7s 才出内容，3500 时撤会露几秒纯白（真机「先白后出」）；
    // 仍低于 8s 的加载超时兜底，异常时不会「遮罩永不撤」。数值演进见 skill miniapp-first-paint-audit。
    const FIRST_SCREEN_READY_MAX_WAIT_MS = 7000

    /*
      样式门禁两步，缺一不可：
      ① 声明过的样式表都取回来了（构建期打的 data-lc-css-pending 已摘掉）；
      ② 插进 DOM 的样式表都生效了（link.sheet 非空）。少了 ② 会在「JS 到了、样式还在
         解析」那一瞬放行，iOS 上露出无版式的页面（裸文字 + 被撑成 300×150 的大图标）。
    */
    const stylesFetched = () => !document.querySelector('link[data-lc-css-pending]')
    const stylesApplied = () => {
      const links = document.querySelectorAll('link[rel="stylesheet"]')
      for (let i = 0; i < links.length; i++) {
        const link = links[i]
        if (link.disabled) continue
        const media = link.getAttribute('media')
        if (media && media !== 'all' && media !== 'screen') continue
        if (!link.sheet) return false
      }
      return true
    }

    const firstScreenReady = () => {
      const root = document.getElementById('app')
      if (!root) return false
      if (!stylesFetched()) return false
      if (!stylesApplied()) return false
      // 只认「真的显示出来的内容」。渲染器根（.miniapp-layout-renderer）不算：它在布局数据
      // 到手前就挂载（components 是空数组），慢网下会提前放行。
      if (root.querySelector('[class*="lc-block"]')) return true
      // 内嵌网页（公告 / 协议外链）：web-view 自带加载态，挂上就算页面有结构。
      if (root.querySelector('iframe, uni-web-view, web-view')) return true
      // 骨架必须逐块验可见：App.vue 把各骨架块 display:none 之后，容器 .app-skeleton-stack
      // 仍是整屏块（实测 390×844），只看容器会让遮罩在 100ms 就撤、页面只剩顶栏。
      const skeletonPieces = root.querySelectorAll(
        '.app-skeleton, .app-skeleton-row, .app-skeleton-card, .app-skeleton-panel, .app-skeleton-line, .app-skeleton-avatar'
      )
      for (let i = 0; i < skeletonPieces.length; i++) {
        if (skeletonPieces[i].getClientRects().length) return true
      }
      // 非渲染器页面（登录、协议页等）用正文判断
      return String(root.innerText || '').trim().length >= 8
    }
    const reveal = () => {
      const appVisible = !document.documentElement.classList.contains('miniapp-theme-pending')
      const waited = Date.now() - readyAt
      if (!appVisible && waited < 1500) {
        setTimeout(reveal, 16)
        return
      }
      if (waited < FIRST_SCREEN_READY_MAX_WAIT_MS && !firstScreenReady()) {
        setTimeout(reveal, 32)
        return
      }
      if (typeof requestAnimationFrame === 'function') {
        requestAnimationFrame(() => requestAnimationFrame(hideBootstrap))
      } else {
        setTimeout(hideBootstrap, 120)
      }
    }
    // 最短覆盖 100ms：等 pending 摘掉之后还要再盖一会儿，免得页面刚挂载就撤。
    setTimeout(reveal, 100)
  }, { once: true })

  window.addEventListener('error', (ev) => {
    const target = ev.target
    if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
      ev.preventDefault()
      showError()
    }
  }, true)

  window.addEventListener('app-resource-error', () => {
    showError(globalThis.__appResourceErrorText || '应用加载失败，请检查网络后重试')
  })

  setTimeout(() => {
    if (!bootstrap.hidden && !bootstrap.classList.contains('is-error')) {
      hint.textContent = '加载时间较长，请保持页面打开'
    }
  }, 3000)

  setTimeout(() => {
    if (!bootstrap.hidden && !bootstrap.classList.contains('is-error')) {
      showError('加载超时，请点击重试')
    }
  }, 8000)
})()
</script>

</body>
</html>
